<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 171" width="1000" height="171" role="img"><title>ResumeBanao — Paste a job description and get an ATS-optimised resume and cover letter, scored by a built-in ATS checker.</title><style>
  :root{--ink:#1f2328;--mute:#59636e;--faint:#d1d9e0;--acc:#1a7f37;--acc2:#2da44e;--card:#f6f8fa}
  @media (prefers-color-scheme: dark){
    :root{--ink:#f0f6fc;--mute:#9198a1;--faint:#30363d;--acc:#3fb950;--acc2:#39d353;--card:#151b23}
  }
  .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif}.sans{font-family:-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace}
  .ink{fill:var(--ink)}.mute{fill:var(--mute)}.acc{fill:var(--acc)}
  .rule{stroke:var(--faint);stroke-width:1}
.box{fill:var(--card);stroke:var(--faint)}
      .bar{fill:var(--acc)}</style>
    <rect class="box" x="0.5" y="0.5" width="999" height="169" rx="6"/>
    <rect class="bar" x="0.5" y="0.5" width="4" height="169" rx="2"/>
    <text x="36" y="40" class="mono mute" font-size="12" letter-spacing="1.5">PRODUCT 02</text>
    <text x="36" y="104" class="serif acc" font-size="52">ATS</text>
    <text x="38" y="132" class="mono mute" font-size="13">scored before download</text>
    <line class="rule" x1="250" y1="28" x2="250" y2="142"/>
    <text x="282" y="58" class="serif ink" font-size="30">ResumeBanao</text>
    <text x="282" y="88" class="sans ink" font-size="16">Paste a job description and get an ATS-optimised resume</text>
    <text x="282" y="110" class="sans ink" font-size="16">and cover letter, scored by a built-in ATS checker.</text>
    <text x="282" y="142" class="mono mute" font-size="12">Next.js · Supabase (Postgres) · Razorpay · AI rewrite</text>
    <text x="964" y="40" text-anchor="end" class="mono acc" font-size="13">resumebanao.app ↗</text>
    </svg>