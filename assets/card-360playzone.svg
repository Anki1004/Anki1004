<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 171" width="1000" height="171" role="img"><title>360PlayZone — Free games across action, puzzle, racing and arcade. No installs, no server, no database, in 16 languages.</title><style>
  :root{--ink:#1f2328;--mute:#59636e;--faint:#d1d9e0;--acc:#1a7f37;--acc2:#2da44e;--card:#f6f8fa}
  @media (prefers-color-scheme: dark){
    :root{--ink:#f0f6fc;--mute:#9198a1;--faint:#30363d;--acc:#3fb950;--acc2:#39d353;--card:#151b23}
  }
  .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif}.sans{font-family:-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace}
  .ink{fill:var(--ink)}.mute{fill:var(--mute)}.acc{fill:var(--acc)}
  .rule{stroke:var(--faint);stroke-width:1}
.box{fill:var(--card);stroke:var(--faint)}
      .bar{fill:var(--acc)}</style>
    <rect class="box" x="0.5" y="0.5" width="999" height="169" rx="6"/>
    <rect class="bar" x="0.5" y="0.5" width="4" height="169" rx="2"/>
    <text x="36" y="40" class="mono mute" font-size="12" letter-spacing="1.5">PRODUCT 03</text>
    <text x="36" y="104" class="serif acc" font-size="52">260+</text>
    <text x="38" y="132" class="mono mute" font-size="13">browser games</text>
    <line class="rule" x1="250" y1="28" x2="250" y2="142"/>
    <text x="282" y="58" class="serif ink" font-size="30">360PlayZone</text>
    <text x="282" y="88" class="sans ink" font-size="16">Free games across action, puzzle, racing and arcade.</text>
    <text x="282" y="110" class="sans ink" font-size="16">No installs, no server, no database, in 16 languages.</text>
    <text x="282" y="142" class="mono mute" font-size="12">React SPA + prerendered HTML · Cloudflare Pages · Sveltia CMS</text>
    <text x="964" y="40" text-anchor="end" class="mono acc" font-size="13">360playzone.com ↗</text>
    </svg>