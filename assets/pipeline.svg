<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img"><title>How I work: source, clean, model, ship, decide</title><style>
  :root{--ink:#1f2328;--mute:#59636e;--faint:#d1d9e0;--acc:#1a7f37;--acc2:#2da44e;--card:#f6f8fa}
  @media (prefers-color-scheme: dark){
    :root{--ink:#f0f6fc;--mute:#9198a1;--faint:#30363d;--acc:#3fb950;--acc2:#39d353;--card:#151b23}
  }
  .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif}.sans{font-family:-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif}.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace}
  .ink{fill:var(--ink)}.mute{fill:var(--mute)}.acc{fill:var(--acc)}
  .rule{stroke:var(--faint);stroke-width:1}
.node{fill:var(--card);stroke:var(--acc);stroke-width:1.5}
      .line{stroke:var(--faint);stroke-width:2}
      .pulse{fill:var(--acc2);animation:run 6s linear infinite}
      @keyframes run{from{transform:translateX(0)}to{transform:translateX(800px)}}
      @media (prefers-reduced-motion: reduce){.pulse{animation:none}}</style><line class="line" x1="100" y1="40" x2="900" y2="40"/><circle class="pulse" cx="100" cy="40" r="4"/><circle class="node" cx="100" cy="40" r="9"/><text x="100" y="44" text-anchor="middle" class="mono acc" font-size="8">01</text><text x="100" y="84" text-anchor="middle" class="mono ink" font-size="14" letter-spacing="2">SOURCE</text><text x="100" y="106" text-anchor="middle" class="mono acc" font-size="12">CSV · API · PDF</text><text x="100" y="132" text-anchor="middle" class="sans mute" font-size="13">whatever the data</text><text x="100" y="150" text-anchor="middle" class="sans mute" font-size="13">actually lives in</text><circle class="node" cx="300" cy="40" r="9"/><text x="300" y="44" text-anchor="middle" class="mono acc" font-size="8">02</text><text x="300" y="84" text-anchor="middle" class="mono ink" font-size="14" letter-spacing="2">CLEAN</text><text x="300" y="106" text-anchor="middle" class="mono acc" font-size="12">Python · Pandas</text><text x="300" y="132" text-anchor="middle" class="sans mute" font-size="13">validate, reshape,</text><text x="300" y="150" text-anchor="middle" class="sans mute" font-size="13">document every fix</text><circle class="node" cx="500" cy="40" r="9"/><text x="500" y="44" text-anchor="middle" class="mono acc" font-size="8">03</text><text x="500" y="84" text-anchor="middle" class="mono ink" font-size="14" letter-spacing="2">MODEL</text><text x="500" y="106" text-anchor="middle" class="mono acc" font-size="12">SQL · DAX · TMDL</text><text x="500" y="132" text-anchor="middle" class="sans mute" font-size="13">star schema, measures</text><text x="500" y="150" text-anchor="middle" class="sans mute" font-size="13">that survive slicers</text><circle class="node" cx="700" cy="40" r="9"/><text x="700" y="44" text-anchor="middle" class="mono acc" font-size="8">04</text><text x="700" y="84" text-anchor="middle" class="mono ink" font-size="14" letter-spacing="2">SHIP</text><text x="700" y="106" text-anchor="middle" class="mono acc" font-size="12">Power BI · Next.js</text><text x="700" y="132" text-anchor="middle" class="sans mute" font-size="13">a report or an app,</text><text x="700" y="150" text-anchor="middle" class="sans mute" font-size="13">whichever fits</text><circle class="node" cx="900" cy="40" r="9"/><text x="900" y="44" text-anchor="middle" class="mono acc" font-size="8">05</text><text x="900" y="84" text-anchor="middle" class="mono ink" font-size="14" letter-spacing="2">DECIDE</text><text x="900" y="106" text-anchor="middle" class="mono acc" font-size="12">the real goal</text><text x="900" y="132" text-anchor="middle" class="sans mute" font-size="13">one question someone</text><text x="900" y="150" text-anchor="middle" class="sans mute" font-size="13">can now answer</text></svg>